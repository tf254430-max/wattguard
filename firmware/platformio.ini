; PlatformIO project for the WattGuard ESP32 firmware.
; Builds for the ESP32 DevKit V1 and runs in either Wokwi (no hardware) or
; on a real board.

[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.10
build_flags =
    -DCORE_DEBUG_LEVEL=2

[env:wokwi]
extends = env:esp32dev
build_flags =
    -DWOKWI_SIMULATION
    -DCORE_DEBUG_LEVEL=2
